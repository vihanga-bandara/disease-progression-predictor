name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Train model
        run: uv run python -m app.train

      - name: Build image
        run: docker build --build-arg MODEL_VERSION=${{ github.ref_name }} -t $IMAGE .

      - name: Smoke test container
        run: |
          docker run -d -p 80:80 --name service $IMAGE
          for i in $(seq 1 30); do curl -sf http://localhost:80/health && break; sleep 1; done
          ./scripts/smoke_test.sh http://localhost:80
          test "$(curl -s http://localhost:80/health | jq -r .model_version)" = "${{ github.ref_name }}"
          docker stop service

      - name: Show container logs
        if: failure()
        run: docker logs service

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push $IMAGE

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          files: |
            artifacts/metrics.json
            artifacts/model.joblib
